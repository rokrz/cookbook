name: APK Android

# Gera o APK do app (versão local, offline), guarda como artefato e, na main, publica na release "apk-latest".
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build do app web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build do APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../caderno-de-receitas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: caderno-de-receitas-apk
          path: caderno-de-receitas.apk

      # Link fixo para baixar no celular:
      # https://github.com/rokrz/cookbook/releases/download/apk-latest/caderno-de-receitas.apk
      - name: Publicar na release apk-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest caderno-de-receitas.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "APK de teste (${GITHUB_SHA::7})" \
            --notes "Gerado automaticamente a partir da main (${GITHUB_SHA}). Instale por cima da versão anterior: a assinatura é sempre a mesma e as receitas são mantidas."
