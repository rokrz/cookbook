name: APK Android

# Gera o APK do app (versão local, offline) e guarda como artefato da execução.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build do app web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build do APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../caderno-de-receitas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: caderno-de-receitas-apk
          path: caderno-de-receitas.apk
